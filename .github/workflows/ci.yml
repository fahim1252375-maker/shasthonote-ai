name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Smoke-test production server startup
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=production PORT=4173 npm start > /tmp/shasthonote-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/api/health | grep -q '"status":"ok"'; then
              echo "Production server health check passed."
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/shasthonote-server.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/shasthonote-server.log
          echo "Production server did not become healthy within 30 seconds."
          exit 1

      - name: Set up Node.js for Firebase Emulator tooling
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0

      - name: Install Firestore Emulator test tooling
        run: npm install --no-save --package-lock=false --no-audit --no-fund firebase-tools @firebase/rules-unit-testing@6.0.0

      - name: Test Firestore security rules in the Emulator
        run: npx firebase emulators:exec --only firestore --project demo-shasthonote "npm run test:rules"
