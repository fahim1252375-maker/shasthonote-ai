name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Set up Node.js for Firebase Emulator tooling
        uses: actions/setup-node@v5
        with:
          node-version: 24.12.0

      - name: Install Firestore Emulator test tooling
        run: npm install --no-save --package-lock=false --no-audit --no-fund firebase-tools @firebase/rules-unit-testing@6.0.0

      - name: Test Firestore security rules in the Emulator
        run: npx firebase emulators:exec --only firestore --project demo-shasthonote "npm run test:rules"
