name: Bug report
description: Report a reproducible issue in ShasthoNote AI.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Never attach real medical records, patient details, identifiable health information, account tokens, API keys, or private Firebase data. Use synthetic examples only. This project is not a medical service.
  - type: input
    id: version
    attributes:
      label: Project version or commit
      placeholder: "e.g. v0.5.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, browser, and Node.js version where relevant.
      placeholder: "e.g. macOS, Chrome, Node.js 22"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal sequence using synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove account identifiers, health information, tokens, and other sensitive values before sharing.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I checked that this is not already reported.
          required: true
        - label: I used synthetic data and removed all secrets and personal information.
          required: true
